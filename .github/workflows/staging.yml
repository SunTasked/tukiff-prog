# Keeps the `staging` branch equal to main; Vercel serves it at https://tukiff-prog-staging.vercel.app (Supabase staging).
name: Sync staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/staging
